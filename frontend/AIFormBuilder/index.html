<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gestor de Formularios — build beautiful forms and surveys in minutes." />
    <!-- Tipografías autoalojadas vía @fontsource (ver src/main.jsx y
         docs/TYPOGRAPHY.md). Sin CDN externo: evita bloqueos regionales. -->
    <title>Gestor de Formularios</title>
    <script>
      // Aplica el tema antes del primer paint para evitar FOUC (flash de tema incorrecto).
      // Clave sincronizada con src/contexts/ThemeContext.jsx (formly_theme_v2).
      (function () {
        try {
          // Limpia la clave legacy del sistema binario anterior (autoguardaba el valor resuelto).
          localStorage.removeItem("formly_theme");
          var saved = localStorage.getItem("formly_theme_v2");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          // "dark" → oscuro; "light" → claro; "system" o sin preferencia → seguir al SO.
          var dark = saved === "dark" || (saved !== "light" && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
